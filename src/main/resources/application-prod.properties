# PolicyFlow production profile. Activate with SPRING_PROFILES_ACTIVE=prod
# Database credentials come from SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.

# Flyway owns the schema. Hibernate only checks that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sessions
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Behind a TLS-terminating reverse proxy or load balancer, so redirects and cookies use https
server.forward-headers-strategy=framework

# Never leak internals in error pages
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# The development demo-password seeder must stay off
policyflow.dev.seed-passwords=false

# First administrator, used only when no active administrator exists
policyflow.bootstrap.admin-email=${POLICYFLOW_ADMIN_EMAIL:}
policyflow.bootstrap.admin-password=${POLICYFLOW_ADMIN_PASSWORD:}
policyflow.bootstrap.admin-name=${POLICYFLOW_ADMIN_NAME:Administrator}