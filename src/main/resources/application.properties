spring.application.name=policyflow

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Error handling
server.error.include-message=never
server.error.include-stacktrace=never

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Development-only demo seeding (disabled by default)
policyflow.dev.seed-passwords=${POLICYFLOW_DEV_SEED_PASSWORDS:false}
policyflow.dev.demo-password=${POLICYFLOW_DEV_DEMO_PASSWORD:}

server.port=${PORT:8080}
